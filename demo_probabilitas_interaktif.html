
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Presentasi Interaktif Probabilitas</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:0}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.card{background:#1e293b;padding:20px;border-radius:16px;max-width:700px}
button{padding:12px 20px;border:none;border-radius:10px;cursor:pointer}
.dice{font-size:60px;margin:10px}
</style>
</head>
<body>
<div class="hero">
<h1>🎲 Eksperimen Dua Dadu & Satu Koin</h1>
<div class="card">
<div id="hasil">
<div class="dice">🎲 🎲 🪙</div>
<p>Tekan tombol untuk simulasi</p>
</div>
<button onclick="lempar()">Lempar!</button>
</div>
</div>

<script>
function rand(n){return Math.floor(Math.random()*n)+1}
function lempar(){
 let d1=rand(6), d2=rand(6);
 let k=Math.random()<0.5?"Gambar":"Angka";
 let jumlah=d1+d2;
 let A=(jumlah%2==1)?"YA":"TIDAK";
 let B=(k=="Gambar")?"YA":"TIDAK";
 document.getElementById("hasil").innerHTML=
 `<div class="dice">🎲${d1} 🎲${d2} 🪙</div>
 <h3>Jumlah = ${jumlah}</h3>
 <p>Kejadian A (Jumlah Ganjil): <b>${A}</b></p>
 <p>Kejadian B (Gambar): <b>${B}</b></p>`;
}
</script>
</body>
</html>
